name: ChatGPT MCP Demo

on:
  push:
    paths:
      - '.github/workflows/chatgpt-mcp-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: implementations/chatgpt-mcp-v0.1
        run: npm install
      - name: Start Shadow Carrier MCP
        working-directory: implementations/chatgpt-mcp-v0.1
        env:
          PORT: '8787'
          SHADOW_ALLOWED_DOMAINS: 'github.com,raw.githubusercontent.com,help.openai.com,platform.openai.com,openai.com'
        run: |
          nohup node src/server.js > /tmp/shadow-server.log 2>&1 &
          echo $! > /tmp/shadow-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/shadow-server.log
          exit 1
      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Open temporary public tunnel
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          URL=''
          for i in {1..45}; do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "MCP_URL=$URL/mcp" >> "$GITHUB_ENV"
          echo "$URL/mcp" > /tmp/mcp-url.txt
          echo "### Temporary Shadow Carrier MCP" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$URL/mcp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "MCP_URL=$URL/mcp"
      - name: Upload endpoint
        uses: actions/upload-artifact@v4
        with:
          name: mcp-endpoint
          path: /tmp/mcp-url.txt
          retention-days: 1
      - name: Keep demo alive
        run: |
          echo "Temporary MCP endpoint: $MCP_URL"
          sleep 1800
